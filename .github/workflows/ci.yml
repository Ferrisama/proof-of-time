name: CI/CD (macOS only)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: "1.25.1"

      - name: Download dependencies
        run: |
          cd vdf-go
          go mod download
          go mod verify

      - name: Format & Vet
        run: |
          cd vdf-go
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "❌ Formatting issues found:"
            gofmt -s -d .
            exit 1
          fi
          go vet ./...

      - name: Build
        run: cd vdf-go && go build -v -o proof-of-time

      - name: Run benchmark & stress test
        run: |
          cd vdf-go
          if command -v gtimeout >/dev/null; then
            gtimeout 120 ./proof-of-time benchmark || true
            gtimeout 60 ./proof-of-time stress-test --workers 2 --runs 3 --delay 2.0 || true
          else
            echo "⚠️ gtimeout not found; install via 'brew install coreutils'"
          fi

  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: "1.25.1"
      - uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          working-directory: vdf-go
          args: --timeout=5m

  security:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: "1.25.1"
      - uses: securego/gosec@master
        with:
          args: "-no-fail ./vdf-go/..."

  coverage:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: "1.25.1"
      - name: Code Coverage
        run: |
          cd vdf-go
          go test -v -coverprofile=coverage.out ./... || true
          go tool cover -func=coverage.out

  docs:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Docs
        run: |
          for f in README.md QUICK_START.md IMPLEMENTATION_SUMMARY.md; do
            if [ -f "$f" ]; then echo "✓ $f found"; else echo "⚠️ Missing $f"; fi
          done
