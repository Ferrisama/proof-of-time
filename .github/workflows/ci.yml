name: CI/CD Pipeline

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        go-version: [ '1.25.1', '1.24.x' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: |
          cd vdf-go
          go mod download
          go mod verify

      - name: Format check
        run: |
          cd vdf-go
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Go formatting issues found:"
            gofmt -s -d .
            exit 1
          fi
        shell: bash

      - name: Vet
        run: |
          cd vdf-go
          go vet ./...

      - name: Build
        run: |
          cd vdf-go
          go build -v -o proof-of-time

      - name: Run benchmark
        run: |
          cd vdf-go
          timeout 120 ./proof-of-time benchmark || true

      - name: Run quick stress test
        run: |
          cd vdf-go
          timeout 60 ./proof-of-time stress-test --workers 2 --runs 3 --delay 2.0 || true

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results-${{ matrix.os }}-go-${{ matrix.go-version }}
          path: vdf-go/benchmark_results.json
          if-no-files-found: ignore

      - name: Upload stress test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: stress-test-results-${{ matrix.os }}-go-${{ matrix.go-version }}
          path: vdf-go/stress_test_results.json
          if-no-files-found: ignore

  lint:
    name: Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.1'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          working-directory: vdf-go
          args: --timeout=5m

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.1'

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec-results.sarif ./vdf-go/...'

      - name: Upload Gosec results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: gosec-results.sarif

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.1'

      - name: Calculate code coverage
        run: |
          cd vdf-go
          go test -v -coverprofile=coverage.out ./... || true
          go tool cover -html=coverage.out -o coverage.html || true

      - name: Upload coverage
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: code-coverage
          path: vdf-go/coverage.html
          if-no-files-found: ignore

  build-release:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: proof-of-time-linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            artifact: proof-of-time-linux-arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            artifact: proof-of-time-darwin-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact: proof-of-time-darwin-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact: proof-of-time-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.1'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          cd vdf-go
          go build -v -o ${{ matrix.artifact }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: vdf-go/${{ matrix.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check README exists
        run: |
          if [ ! -f README.md ]; then
            echo "README.md not found!"
            exit 1
          fi
          echo "✓ README.md found"

      - name: Check documentation files
        run: |
          docs=("README.md" "QUICK_START.md" "IMPLEMENTATION_SUMMARY.md")
          for doc in "${docs[@]}"; do
            if [ -f "$doc" ]; then
              echo "✓ $doc found"
            else
              echo "⚠ Warning: $doc not found"
            fi
          done

  notify:
    name: Notification
    runs-on: ubuntu-latest
    if: always()
    needs: [ build-and-test, lint, security, code-quality ]

    steps:
      - name: Check job status
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ All CI/CD checks passed!"
          else
            echo "❌ Some CI/CD checks failed"
            exit 1
          fi
